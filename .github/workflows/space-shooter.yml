name: Generate Space Shooter

on:
  workflow_dispatch:
  schedule:
    - cron: "23 0 * * *"

permissions:
  contents: write

concurrency:
  group: space-shooter-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-space-shooter.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-space-shooter.txt

      - name: Generate animation from real contribution data
        run: python scripts/generate_space_shooter.py

      - name: Commit animation if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/space-shooter.gif
          if git diff --cached --quiet; then
            echo "Animation is unchanged; no commit needed."
          else
            git commit -m "Update space shooter animation"
            git push
          fi
